<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>江戸の年の瀬 絵巻</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #16110d; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  #preload { position: absolute; left: 0; top: 0; opacity: 0.01; font-size: 20px; width: 1080px; }
  .m { font-family: 'Shippori Mincho', serif; font-weight: 800; }
  .k { font-family: 'Zen Kurenaido', serif; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<div id="preload"></div>
<script>
// ===== 基本設定 =====
const W = 1080, BAND_Y = 380, BAND_H = 900, SW = 1200, DUR = 52;
const INK = '#2b2118', SKIN = '#f1dfc6', PAPER = '#efe4c8', GOLD = '#e8c46a', IVORY = '#f4ead2';
const COL = { ai: '#2f4d72', cha: '#8a5a3b', mido: '#5b8a72', shu: '#b8432f', nezu: '#7a7a74', ki: '#c99a45', mura: '#6b4c7a', kon: '#26344f' };
const sx0 = i => (6 - i) * SW;            // 場面 i の左端（世界座標）
const Z = 1.15;                           // 絵巻の拡大率
const CO = [600, 540, 590, 560, 520, 560, 600]; // 場面ごとのカメラ中心（場面内座標）
const C = i => sx0(i) + CO[i];            // 場面 i の中心

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeOut = u => 1 - Math.pow(1 - u, 3);
const easeIn = u => u * u * u;
const frac = v => v - Math.floor(v);
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const f1 = n => n.toFixed(1);

// ===== カメラ =====
const camKeys = [[0, C(0)], [3.5, C(0) - 30], [4.5, C(1) + 25], [11, C(1) - 25], [12, C(2) + 25], [18, C(2) - 25],
  [19, C(3) + 25], [26, C(3) - 25], [27, C(4) + 25], [37, C(4) - 25], [38, C(5) + 25], [45, C(5) - 25], [46, C(6) + 25], [DUR, C(6) - 10]];
function camCenter(t) {
  for (let k = 0; k < camKeys.length - 1; k++) {
    const [ta, xa] = camKeys[k], [tb, xb] = camKeys[k + 1];
    if (t <= tb) { const u = clamp((t - ta) / (tb - ta)); return lerp(xa, xb, tb - ta <= 1.01 ? ease(u) : u); }
  }
  return camKeys[camKeys.length - 1][1];
}

// ===== テキスト =====
const chapters = [
  [0, 4, '絵巻で見る', '江戸の年の瀬', ''],
  [4, 11.5, '其の一', '煤払い', '十二月十三日'],
  [11.5, 18.5, '其の二', '歳の市', '十二月十七・十八日　浅草'],
  [18.5, 26.5, '其の三', '餅つき', '年の暮れ'],
  [26.5, 37.5, '其の四', '掛取り', '大晦日'],
  [37.5, 45.5, '其の五', '年越し', '大晦日の夜'],
  [45.5, DUR + 1, '結', '元日', '正月一日'],
];
const captions = [
  [0.6, 4.2, '江戸っ子の年末は', '{戦い}だった。', true],
  [4.7, 8.1, '年末の始まりは', '大掃除「{煤払い}」'],
  [8.1, 11.3, '終わったら、なぜか', '{胴上げ}。'],
  [12.2, 15.2, '浅草の{歳の市}で', '正月用品をまとめ買い'],
  [15.2, 18.3, 'しめ飾り、門松、羽子板', '年に一度の大市'],
  [19.2, 22.6, '月末は{餅つき}', '鳶が臼と杵をかついで回る'],
  [22.6, 26.3, 'その名も', '「{引きずり餅}」'],
  [27.2, 30.2, 'そして大晦日', '{借金取り}がやって来る'],
  [30.2, 33.4, '江戸の買い物は{ツケ}払い', '盆と大晦日にまとめて払う'],
  [33.4, 37.3, '払えない者は{居留守}', '夜が明ければ、もう来ない'],
  [38.2, 41.5, '{年越しそば}をすすり', '細く長く、来年も'],
  [41.5, 45.3, '除夜の鐘は{百八つ}', '煩悩を払って新年へ'],
  [46.2, 49.3, '明けまして', '{おめでとうございます}', true],
  [49.3, DUR + 1, '次回', '江戸の{正月}はもっと騒がしい'],
];
function richLine(s, gold) {
  return s.replace(/\{([^}]*)\}/g, `<tspan fill="${gold}">$1</tspan>`);
}
function vtext(x, y, str, size, fill, cls = 'm', extra = '') {
  return [...str].map((ch, i) => `<text x="${x}" y="${f1(y + i * size * 1.06)}" font-size="${size}" fill="${fill}" text-anchor="middle" class="${cls}" ${extra}>${ch}</text>`).join('');
}
function fxText(x, y, str, size, fill, t0, t, life = 0.5, cls = 'm') {
  const a = t - t0; if (a < 0 || a > life) return '';
  const pop = a < 0.12 ? 0.6 + 0.4 * easeOut(a / 0.12) * 1.15 : 1.0 + 0.05 * (1 - (a - 0.12) / life);
  const op = a > life - 0.12 ? (life - a) / 0.12 : 1;
  return `<g transform="translate(${f1(x)},${f1(y)}) scale(${pop.toFixed(3)})" opacity="${op.toFixed(2)}"><text class="${cls}" font-size="${size}" text-anchor="middle" fill="${fill}" stroke="${PAPER}" stroke-width="10" paint-order="stroke" stroke-linejoin="round" font-weight="700">${str}</text></g>`;
}
function kan(n) {
  const d = '〇一二三四五六七八九';
  let s = '';
  if (n >= 100) { s += '百'; n -= 100; }
  if (n >= 10) { const tns = Math.floor(n / 10); s += (tns > 1 ? d[tns] : '') + '十'; n %= 10; }
  if (n > 0) s += d[n];
  return s || '〇';
}

// ===== 人物 =====
// x,y: 足元（世界座標）。右向きが基準、dir=-1 で左向き
function person(x, y, o = {}) {
  const s = o.s || 1, dir = o.dir || 1, c = o.c || COL.ai, obi = o.obi || COL.shu;
  const shF = [20, -104], shB = [-18, -104];
  const armOf = (sh, a, tgt) => {
    if (tgt) {
      const lx = (tgt[0] - x) / (dir * s), ly = (tgt[1] - y) / s;
      const dx = lx - sh[0], dy = ly - sh[1], d = Math.hypot(dx, dy), L = Math.min(d, 58);
      return [sh[0] + dx / d * L, sh[1] + dy / d * L];
    }
    return [sh[0] + Math.sin(a) * 52, sh[1] + Math.cos(a) * 52];
  };
  const hF = armOf(shF, o.aF ?? 0.2, o.tF), hB = armOf(shB, o.aB ?? -0.2, o.tB);
  const sleeve = (sh, h) => `<line x1="${sh[0]}" y1="${sh[1]}" x2="${f1(h[0])}" y2="${f1(h[1])}" stroke="${INK}" stroke-width="22" stroke-linecap="round"/><line x1="${sh[0]}" y1="${sh[1]}" x2="${f1(h[0])}" y2="${f1(h[1])}" stroke="${c}" stroke-width="16" stroke-linecap="round"/><circle cx="${f1(h[0])}" cy="${f1(h[1])}" r="7" fill="${SKIN}" stroke="${INK}" stroke-width="2"/>`;
  const st = o.step || 0;
  const legs = `<path d="M-10,-34 L${f1(-12 + st * 10)},0 M10,-34 L${f1(12 - st * 10)},0" stroke="${INK}" stroke-width="7" stroke-linecap="round" fill="none"/>`;
  const short = o.happi;  // 法被（短い上着）
  const hem = short ? -62 : -30;
  const body = `<path d="M-24,-112 Q-30,${(hem - 112) / 2} -33,${hem} L33,${hem} Q30,${(hem - 112) / 2} 24,-112 Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>` +
    (short ? `<path d="M-14,-62 L-14,-34 M14,-62 L14,-34" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><path d="M-6,-100 h12 v12 h-12z" fill="none" stroke="${IVORY}" stroke-width="3"/>` : '') +
    `<path d="M-11,-112 L3,-86 L14,-112" stroke="${IVORY}" stroke-width="5" fill="none"/>` +
    `<rect x="-31" y="-82" width="62" height="12" fill="${obi}" stroke="${INK}" stroke-width="2"/>`;
  const hy = o.hy || 0, hx = o.hx || 0;
  let head = `<g transform="translate(${hx},${hy})"><circle cx="2" cy="-134" r="21" fill="${SKIN}" stroke="${INK}" stroke-width="2.5"/>`;
  if (o.f) head += `<ellipse cx="-12" cy="-150" rx="17" ry="13" fill="${INK}"/><path d="M-19,-128 A21 21 0 0 1 22,-144 Q4,-140 -10,-124 Z" fill="${INK}"/><line x1="-26" y1="-156" x2="4" y2="-160" stroke="${COL.ki}" stroke-width="3"/>`;
  else head += `<path d="M-19,-128 A21 21 0 0 1 18,-148 Q2,-142 -12,-124 Z" fill="${INK}"/><rect x="-4" y="-163" width="20" height="7" rx="3" fill="${INK}" transform="rotate(-12 6 -160)"/>`;
  if (o.band) head += `<path d="M-19,-146 Q2,-152 23,-140" stroke="${IVORY}" stroke-width="6" fill="none"/>`;
  if (o.monk) head = `<g transform="translate(${hx},${hy})"><circle cx="2" cy="-134" r="21" fill="${SKIN}" stroke="${INK}" stroke-width="2.5"/>`;
  head += o.eye === 'shut' ? `<path d="M9,-136 q4,3 8,0" stroke="${INK}" stroke-width="2" fill="none"/>` : `<circle cx="13" cy="-136" r="2.6" fill="${INK}"/>`;
  if (o.mouth) head += `<ellipse cx="17" cy="-124" rx="3.5" ry="${o.mouth}" fill="${INK}"/>`;
  head += `</g>`;
  return `<g transform="translate(${f1(x)},${f1(y)}) scale(${s * dir},${s})">${sleeve(shB, hB)}${legs}${body}${head}${sleeve(shF, hF)}</g>`;
}

// ===== 建物（吹抜屋台：屋根を取り払って中を見せる絵巻の技法） =====
function house(x0, y0, w, h, o = {}) {
  const D = o.D || [170, -120], [dx, dy] = D;
  const bx = x0 + dx, by = y0 + dy;
  let s = '';
  // 奥の屋根（軒先だけ見せる）
  s += `<path d="M${bx - 20},${by - h} L${bx + w + 20},${by - h} L${bx + w + 20 + dx * .55},${by - h + dy * .55} L${bx - 20 + dx * .55},${by - h + dy * .55} Z" fill="#5d5650" stroke="${INK}" stroke-width="3"/>`;
  for (let i = 1; i < 9; i++) { const u = i / 9; s += `<line x1="${f1(bx - 20 + (w + 40) * u)}" y1="${by - h}" x2="${f1(bx - 20 + (w + 40) * u + dx * .55)}" y2="${f1(by - h + dy * .55)}" stroke="#3b3632" stroke-width="2"/>`; }
  // 奥の壁
  s += `<rect x="${bx}" y="${by - h}" width="${w}" height="${h}" fill="${o.wall || '#ece2cb'}" stroke="${INK}" stroke-width="3"/>`;
  if (o.shoji !== false) {
    for (let i = 0; i < 4; i++) {
      const sx = bx + 20 + i * (w - 40) / 4, sw = (w - 40) / 4 - 8;
      s += `<rect x="${f1(sx)}" y="${by - h + 50}" width="${f1(sw)}" height="${h - 70}" fill="#f6f0e0" stroke="#8a6b4a" stroke-width="3"/>`;
      for (let k = 1; k < 4; k++) s += `<line x1="${f1(sx + sw * k / 4)}" y1="${by - h + 50}" x2="${f1(sx + sw * k / 4)}" y2="${by - 20}" stroke="#b39b7c" stroke-width="1.5"/>`;
      for (let k = 1; k < 5; k++) s += `<line x1="${f1(sx)}" y1="${f1(by - h + 50 + (h - 70) * k / 5)}" x2="${f1(sx + sw)}" y2="${f1(by - h + 50 + (h - 70) * k / 5)}" stroke="#b39b7c" stroke-width="1.5"/>`;
    }
  }
  s += `<line x1="${bx}" y1="${by - h + 34}" x2="${bx + w}" y2="${by - h + 34}" stroke="#5a3d2a" stroke-width="6"/>`;
  // 左の壁（低く）
  s += `<path d="M${x0},${y0} L${bx},${by} L${bx},${by - h} L${x0},${y0 - h} Z" fill="#e4d7b9" stroke="${INK}" stroke-width="3"/>`;
  // 畳
  s += `<path d="M${x0},${y0} L${x0 + w},${y0} L${bx + w},${by} L${bx},${by} Z" fill="#d8c27f" stroke="${INK}" stroke-width="3"/>`;
  for (let i = 1; i < 4; i++) { const u = i / 4; s += `<line x1="${f1(x0 + w * u)}" y1="${y0}" x2="${f1(bx + w * u)}" y2="${by}" stroke="#a88f4e" stroke-width="2"/>`; }
  s += `<line x1="${f1(x0 + dx / 2)}" y1="${f1(y0 + dy / 2)}" x2="${f1(x0 + w + dx / 2)}" y2="${f1(y0 + dy / 2)}" stroke="#a88f4e" stroke-width="2"/>`;
  // 柱
  for (const px of [bx, bx + w]) s += `<rect x="${px - 6}" y="${by - h}" width="12" height="${h}" fill="#5a3d2a"/>`;
  return s;
}
function houseFront(x0, y0, w, h, o = {}) {
  const [dx, dy] = o.D || [170, -120];
  let s = '';
  for (const px of [x0, x0 + w]) s += `<rect x="${px - 7}" y="${y0 - h}" width="14" height="${h}" fill="#5a3d2a" stroke="${INK}" stroke-width="2"/>`;
  s += `<rect x="${x0 - 12}" y="${y0 - 8}" width="${w + 24}" height="16" fill="#6b4a33" stroke="${INK}" stroke-width="2"/>`;
  return s;
}
function roofs(x, y, n, r, col = '#5d5650') {
  let s = '';
  const R = rng(r);
  for (let i = 0; i < n; i++) {
    const rx = x + i * 150 + R() * 40, ry = y - i * 40 + R() * 30, w = 120 + R() * 60;
    s += `<path d="M${f1(rx)},${f1(ry)} l${f1(w)},0 l70,-50 l${f1(-w)},0 Z" fill="${col}" stroke="${INK}" stroke-width="2.5"/>` +
      `<path d="M${f1(rx)},${f1(ry)} l0,40 l${f1(w)},0 l0,-40" fill="#e9dec3" stroke="${INK}" stroke-width="2.5"/>`;
  }
  return s;
}
function pine(x, y, s = 1) {
  let g = `<path d="M0,0 C10,-60 -20,-120 20,-200" stroke="#5a3d2a" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  for (const [px, py, w] of [[-30, -120, 90], [30, -170, 110], [0, -220, 80], [-50, -180, 70]]) g += `<ellipse cx="${px}" cy="${py}" rx="${w / 2}" ry="18" fill="#3f6b4f" stroke="${INK}" stroke-width="2.5"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">${g}</g>`;
}

// ===== 金雲（すやり霞） =====
function kasumi(x, y, w, h) {
  return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(h / 2)}" fill="url(#gold)" stroke="#a8842f" stroke-width="2"/>` +
    `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(h / 2)}" fill="url(#goldDust)"/>`;
}
function cloudBands(i) {
  const R = rng(100 + i), x0 = sx0(i);
  let s = '';
  for (let k = 0; k < 6; k++) s += kasumi(x0 + k * 220 - 60 + R() * 60, -30 + R() * 90, 260 + R() * 160, 70 + R() * 30);
  for (let k = 0; k < 6; k++) s += kasumi(x0 + k * 220 - 60 + R() * 60, 800 + R() * 50, 260 + R() * 160, 70 + R() * 30);
  // 場面の区切り
  for (let k = 0; k < 5; k++) { const w = 220 + R() * 120; s += kasumi(x0 - w / 2 + (R() - .5) * 80, 150 + k * 140 + R() * 40, w, 64 + R() * 20); }
  return s;
}

// ===== 場面 =====
const scenes = [];

// 0: 題
scenes[0] = t => {
  const x = sx0(0);
  let b = roofs(x + 40, 760, 7, 7) + roofs(x + 20, 560, 6, 9);
  b += `<path d="M${x + 60},560 L${x + 200},360 Q${x + 230},330 ${x + 260},360 L${x + 400},560 Z" fill="#41557a" stroke="${INK}" stroke-width="3"/><path d="M${x + 168},405 L${x + 200},360 Q${x + 230},330 ${x + 260},360 L${x + 292},405 Q${x + 260},420 ${x + 230},400 Q${x + 200},420 ${x + 168},405Z" fill="${IVORY}" stroke="${INK}" stroke-width="2"/>`;
  // 日本橋
  b += `<path d="M${x + 760},720 Q${x + 980},600 ${x + 1200},720" stroke="#6b4a33" stroke-width="22" fill="none"/><path d="M${x + 760},700 Q${x + 980},580 ${x + 1200},700" stroke="${COL.shu}" stroke-width="6" fill="none"/>`;
  for (let k = 0; k < 5; k++) { const u = (k + 1) / 6, bx = lerp(x + 760, x + 1200, u), by = 720 - 120 * 4 * u * (1 - u) * 0.95; b += person(bx + Math.sin(t * 2 + k) * 6, by - 8, { s: .42, c: [COL.ai, COL.cha, COL.mido, COL.shu, COL.nezu][k], dir: k % 2 ? 1 : -1, step: Math.sin(t * 6 + k) }); }
  // 題簽
  const tx = x + 620, ty = 150;
  b += `<rect x="${tx}" y="${ty}" width="170" height="560" fill="#f7f0dc" stroke="${INK}" stroke-width="3"/><rect x="${tx + 10}" y="${ty + 10}" width="150" height="540" fill="none" stroke="${COL.shu}" stroke-width="2"/>`;
  b += vtext(tx + 85, ty + 110, '江戸の年の瀬', 82, INK);
  return { b };
};

// 1: 煤払い
scenes[1] = t => {
  const x = sx0(1), x0 = x + 70, y0 = 700, w = 520, h = 240;
  let b = house(x0, y0, w, h);
  const sweep = t < 8.2 ? Math.sin(t * 5) : 0;
  // 煤竹で掃く二人
  for (const [px, ph, c] of [[x0 + 150, 0, COL.cha], [x0 + 360, 1.3, COL.nezu]]) {
    const tip = [px + 70 + Math.sin(t * 5 + ph) * 50, y0 - 120 - h - 10];
    const hand = [px + 32, y0 - 128];
    b += person(px, y0 - 20, { c, band: true, tF: hand, tB: [hand[0] - 10, hand[1] + 26] });
    b += `<line x1="${f1(hand[0] - 10)}" y1="${hand[1] + 40}" x2="${f1(tip[0])}" y2="${tip[1]}" stroke="#9c8a4a" stroke-width="7"/>`;
    b += `<ellipse cx="${f1(tip[0])}" cy="${tip[1]}" rx="34" ry="16" fill="#6f7d47" stroke="${INK}" stroke-width="2" transform="rotate(${f1(Math.sin(t * 5 + ph) * 20)} ${f1(tip[0])} ${tip[1]})"/>`;
    for (let k = 0; k < 4; k++) {
      const a = frac(t * 0.9 + k / 4 + ph);
      b += `<circle cx="${f1(tip[0] + (k - 1.5) * 30 + a * 20)}" cy="${f1(tip[1] + a * 160)}" r="${f1(10 + a * 22)}" fill="#6d6a64" opacity="${f1((1 - a) * 0.45)}"/>`;
    }
  }
  b += houseFront(x0, y0, w, h);
  // 胴上げ
  const cx = x + 870, gy = 720;
  const tossing = t >= 8.2;
  const ph = tossing ? frac((t - 8.2) / 1.05) : 0;
  const lift = tossing ? 190 * Math.sin(Math.PI * ph) : 0;
  const my = gy - 200 - lift;
  let back = '', front = '';
  const throwers = [[cx - 70, gy - 30, COL.ai, 1], [cx + 70, gy - 30, COL.mido, -1], [cx - 50, gy + 10, COL.cha, 1], [cx + 60, gy + 10, COL.nezu, -1]];
  throwers.forEach(([px, py, c, d], k) => {
    const up = tossing ? (ph < 0.25 || ph > 0.85 ? [cx + (px - cx) * .3, my + 40] : [px + d * 10, py - 260]) : null;
    const p = person(px, py, { c, dir: d, band: true, tF: up, tB: up ? [up[0] - d * 16, up[1] + 6] : null, aF: 0.3, mouth: tossing ? 5 : 0 });
    if (k < 2) back += p; else front += p;
  });
  b += back;
  if (tossing) {
    const rot = -90 + Math.sin(t * 7) * 14;
    b += `<g transform="translate(${cx},${f1(my)}) rotate(${f1(rot)})">${person(0, 75, { c: COL.mura, obi: COL.ki, aF: 2.6, aB: -2.6, mouth: 7 })}</g>`;
  } else {
    b += person(cx, gy - 40, { c: COL.mura, obi: COL.ki, aF: -0.6, aB: 0.5 });
  }
  b += front;
  let fx = '';
  if (tossing) for (let k = 0; k < 3; k++) fx += fxText(cx + (k % 2 ? 120 : -120), gy - 380, 'わっしょい！', 54, COL.shu, 8.2 + k * 1.05, t, 0.7);
  return { b, fx };
};

// 2: 歳の市
function stall(x, y, w, c1, c2) {
  let s = `<rect x="${x}" y="${y - 210}" width="10" height="210" fill="#5a3d2a"/><rect x="${x + w - 10}" y="${y - 210}" width="10" height="210" fill="#5a3d2a"/>`;
  for (let i = 0; i < 6; i++) s += `<path d="M${f1(x - 20 + i * (w + 40) / 6)},${y - 210} l${f1((w + 40) / 6)},0 l20,-50 l${f1(-(w + 40) / 6)},0Z" fill="${i % 2 ? c1 : c2}" stroke="${INK}" stroke-width="2"/>`;
  s += `<rect x="${x}" y="${y - 70}" width="${w}" height="70" fill="#8a6440" stroke="${INK}" stroke-width="3"/>`;
  return s;
}
function shime(x, y) {
  let s = `<path d="M${x - 40},${y} Q${x},${y + 30} ${x + 40},${y}" stroke="#c9a250" stroke-width="12" fill="none"/><path d="M${x - 40},${y} Q${x},${y + 30} ${x + 40},${y}" stroke="#8b6d2c" stroke-width="2" fill="none" stroke-dasharray="6 6"/>`;
  for (const dx of [-24, 0, 24]) s += `<path d="M${x + dx},${y + 14} l8,10 l-8,8 l8,10 l-8,8" stroke="${IVORY}" stroke-width="5" fill="none"/>`;
  s += `<circle cx="${x}" cy="${y + 8}" r="11" fill="#e07a2a" stroke="${INK}" stroke-width="2"/>`;
  return s;
}
function kadomatsu(x, y) {
  let s = '';
  for (const [dx, hh] of [[-16, 150], [0, 190], [16, 130]]) s += `<path d="M${x + dx - 9},${y} L${x + dx - 9},${y - hh + 12} L${x + dx + 9},${y - hh} L${x + dx + 9},${y}Z" fill="#6f9a52" stroke="${INK}" stroke-width="2"/>`;

  s += `<rect x="${x - 38}" y="${y - 50}" width="76" height="50" fill="#c9a250" stroke="${INK}" stroke-width="2"/><path d="M${x - 38},${y - 30} h76" stroke="${INK}" stroke-width="3"/>`;

}

// 3: 餅つき
function usu(cx, cy, squash = 0) {
  return `<path d="M${cx - 55},${cy - 80} Q${cx - 40},${cy - 40} ${cx - 50},${cy} L${cx + 50},${cy} Q${cx + 40},${cy - 40} ${cx + 55},${cy - 80}Z" fill="#8b5a33" stroke="${INK}" stroke-width="3"/>` +

    `<ellipse cx="${cx}" cy="${f1(cy - 86 + squash * 4)}" rx="${f1(36 + squash * 8)}" ry="${f1(14 - squash * 5)}" fill="#fbf8ef" stroke="#b8ad95" stroke-width="2"/>`;
}
scenes[3] = t => {
  const x = sx0(3);

  b += pine(x + 1120, 700, 1.1);
  const cx = x + 560, cy = 760;
  const T0 = 19.4, P = 0.8;
  const p = t < T0 ? 0.5 : frac((t - T0) / P);
  const u = p < 0.5 ? easeOut(p / 0.5) : 1 - easeIn((p - 0.5) / 0.5);
  const head = [lerp(cx - 4, cx - 80, u), lerp(cy - 110, cy - 330, u)];
  const hands = [lerp(cx - 85, cx - 120, u), lerp(cy - 175, cy - 205, u)];
  const ang = Math.atan2(head[1] - hands[1], head[0] - hands[0]) * 180 / Math.PI;
  const squash = t >= T0 ? Math.max(0, 1 - p * 5) : 0;
  b += usu(cx, cy, squash);

  b += person(cx - 160, cy + 10, { c: COL.ai, happi: true, band: true, tF: hands, tB: [hands[0] - 12, hands[1] + 20], mouth: u < .2 ? 5 : 0 });
  const hl = Math.hypot(head[0] - hands[0], head[1] - hands[1]);
  b += `<g transform="translate(${f1(hands[0])},${f1(hands[1])}) rotate(${f1(ang)})"><rect x="-12" y="-5" width="${f1(hl)}" height="10" fill="#b68b55" stroke="${INK}" stroke-width="2"/><rect x="${f1(hl - 22)}" y="-40" width="46" height="80" rx="8" fill="#a8743f" stroke="${INK}" stroke-width="3"/></g>`;
  // 返し手
  const reach = u > 0.55;
  b += `<path d="M${cx + 120},${cy} q0,-30 30,-30 h40 q30,0 30,30Z" fill="#7d8c96" stroke="${INK}" stroke-width="2"/>`;

  for (let k = 0; k < 3; k++) { const a = frac(t * 0.7 + k / 3); b += `<path d="M${f1(wx + 10 + k * 14)},${f1(cy - 290 - a * 90)} q12,-14 0,-28 q-12,-14 0,-28" stroke="#ffffff" stroke-width="5" fill="none" opacity="${f1((1 - a) * .7)}"/>`; }
  b += person(wx + 110, cy + 20, { c: COL.kon, happi: true, band: true, step: -Math.sin(t * 6), aF: -0.5, aB: 0.4 });
  let fx = '';
  for (let k = 0; k < 9; k++) fx += fxText(cx + (k % 2 ? 70 : -60), cy - 360, k % 2 ? 'たん！' : 'ぺっ', 70, INK, T0 + k * P, t, 0.45);

const bells = [41.7, 43.1, 44.5];

  b += `<path d="M${bowl[0] - 26},${bowl[1]} q26,36 52,0Z" fill="${COL.shu}" stroke="${INK}" stroke-width="2.5"/>`;

  for (let k = 0; k < 3; k++) { const a = frac(t * 0.6 + k / 3); b += `<path d="M${f1(bowl[0] + 10 + k * 10)},${f1(bowl[1] - 20 - a * 80)} q10,-12 0,-24 q-10,-12 0,-24" stroke="#ffffff" stroke-width="4" fill="none" opacity="${f1((1 - a) * .6)}"/>`; }
  // 鐘楼

  b += `</g>`;
  // 撞木
  const lx = tx - 210 + swing;
  b += `<line x1="${tx - 170}" y1="320" x2="${f1(lx + 30)}" y2="500" stroke="${INK}" stroke-width="2.5"/><line x1="${tx - 100}" y1="320" x2="${f1(lx + 110)}" y2="500" stroke="${INK}" stroke-width="2.5"/>`;
  b += `<rect x="${f1(lx)}" y="488" width="138" height="26" rx="12" fill="#b68b55" stroke="${INK}" stroke-width="3"/>`;
  // 僧
  b += person(tx - 290, 770, { c: '#3a3a3a', obi: '#3a3a3a', monk: true, tF: [lx - 10, 500], tB: [lx - 20, 520] });
  b += `<line x1="${f1(lx)}" y1="501" x2="${tx - 262}" y2="${f1(660)}" stroke="#c9a250" stroke-width="4"/>`;
  let glow = `<circle cx="${yx + 75}" cy="${gy - 160}" r="240" fill="url(#glow)"/>`;
  let fx = '';
  if (t > 38.2 && t < 41.5) fx += fxText(cx + 40, gy - 260, 'ずるずる', 58, INK, 38.4 + Math.floor((t - 38.4) / 0.9) * 0.9, t, 0.7);
  bells.forEach(tk => {
    fx += fxText(tx, 220, 'ゴーン', 84, INK, tk, t, 1.3);
    const a = t - tk;
    if (a > 0 && a < 1.3) for (let r = 0; r < 3; r++) { const rr = 60 + (a * 260 + r * 50); fx += `<ellipse cx="${tx}" cy="470" rx="${f1(rr)}" ry="${f1(rr * .6)}" fill="none" stroke="${GOLD}" stroke-width="4" opacity="${f1(Math.max(0, 1 - a / 1.3) * 0.8)}"/>`; }

function makePaper() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), R = rng(7);
  g.fillStyle = PAPER; g.fillRect(0, 0, 512, 512);
  const img = g.getImageData(0, 0, 512, 512);
  for (let i = 0; i < img.data.length; i += 4) { const n = (R() - .5) * 14; img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n * .8; }
  g.putImageData(img, 0, 0);
  g.strokeStyle = 'rgba(150,120,80,0.10)';
  for (let i = 0; i < 160; i++) { g.lineWidth = .5 + R() * 1.2; g.beginPath(); const x = R() * 512, y = R() * 512, a = R() * 6.28, l = 10 + R() * 40; g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l / 2 + R() * 6, y + Math.sin(a) * l / 2 + R() * 6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  paperURL = c.toDataURL('image/png');
}
function defs() {
  return `<defs>
  <pattern id="paper" patternUnits="userSpaceOnUse" width="512" height="512"><image href="${paperURL}" width="512" height="512"/></pattern>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc93"/><stop offset="1" stop-color="#d1a548"/></linearGradient>
  <pattern id="goldDust" patternUnits="userSpaceOnUse" width="60" height="40"><circle cx="8" cy="9" r="2.2" fill="#fff6c8" opacity=".7"/><circle cx="38" cy="26" r="1.6" fill="#fff6c8" opacity=".6"/><rect x="24" y="6" width="5" height="4" fill="#b8902f" opacity=".5" transform="rotate(20 26 8)"/><circle cx="52" cy="12" r="1.2" fill="#8a6a22" opacity=".5"/></pattern>
  <linearGradient id="night" y1="0" y2="0" gradientUnits="userSpaceOnUse" x1="${sx0(5) - 120}" x2="${sx0(4) + SW + 140}">
    <stop offset="0" stop-color="#7484b8" stop-opacity="0"/><stop offset="0.06" stop-color="#7484b8" stop-opacity="1"/><stop offset="0.95" stop-color="#7484b8" stop-opacity="1"/><stop offset="1" stop-color="#7484b8" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset=".4" stop-color="#ffb84a" stop-opacity=".25"/><stop offset="1" stop-color="#ffb84a" stop-opacity="0"/></radialGradient>
  <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a07c"/><stop offset=".55" stop-color="#f6d3a2"/><stop offset="1" stop-color="#f3e6c6"/></linearGradient>
  <linearGradient id="roller" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b2416"/><stop offset=".45" stop-color="#9a6a42"/><stop offset="1" stop-color="#2b1a10"/></linearGradient>
  <pattern id="seigaiha" patternUnits="userSpaceOnUse" width="80" height="40"><g fill="none" stroke="${GOLD}" stroke-width="2"><circle cx="40" cy="40" r="38"/><circle cx="40" cy="40" r="28"/><circle cx="40" cy="40" r="18"/><circle cx="0" cy="20" r="38"/><circle cx="80" cy="20" r="38"/></g></pattern>
  <clipPath id="band"><rect x="0" y="${BAND_Y}" width="${W}" height="${BAND_H}"/></clipPath>
  </defs>`;
}
function fadeIn(t, a, b, d = 0.3) { return clamp(Math.min((t - a) / d, (b - t) / d)); }

function render(t) {
  const VW = W / Z, cam = camCenter(t) - VW / 2;
  const unroll = easeOut(clamp((t - 0.15) / 1.35));
  let s = defs();
  s += `<rect width="${W}" height="1920" fill="#16110d"/>`;
  s += `<rect y="1560" width="${W}" height="360" fill="url(#seigaiha)" opacity=".07"/>`;
  // 見出し
  for (const [a, b2, top, main, sub] of chapters) {
    const op = fadeIn(t, a, b2, 0.35); if (op <= 0) continue;
    s += `<g opacity="${op.toFixed(2)}">`;
    s += `<text x="540" y="200" font-size="34" class="m" text-anchor="middle" fill="${GOLD}" letter-spacing="8">${top}</text>`;
    s += `<text x="540" y="292" font-size="86" class="m" text-anchor="middle" fill="${IVORY}" letter-spacing="10">${main}</text>`;
    if (sub) s += `<text x="540" y="348" font-size="34" class="m" text-anchor="middle" fill="${GOLD}">${sub}</text>`;
    s += `</g>`;
  }
  // 絵巻
  const revealX = W - W * unroll;
  s += `<g clip-path="url(#band)"><g clip-path="url(#reveal)">`;
  s += `<clipPath id="reveal"><rect x="${f1(revealX)}" y="${BAND_Y}" width="${W}" height="${BAND_H}"/></clipPath>`;
  s += `<g transform="translate(${f1(-cam * Z)},${f1(BAND_Y - 60 * Z)}) scale(${Z})">`;
  s += `<rect x="${f1(cam - 10)}" y="0" width="${f1(VW + 20)}" height="${BAND_H}" fill="url(#paper)"/>`;
  let base = '', glow = '', fx = '', clouds = '';
  scenes.forEach((fn, i) => {
    const l = sx0(i), r = l + SW;
    if (r < cam - 300 || l > cam + VW + 300) return;
    const o = fn(t); base += o.b || ''; glow += o.glow || ''; fx += o.fx || '';
    clouds += cloudBands(i);
  });
  s += base;
  s += `<rect x="${sx0(5) - 120}" y="0" width="${SW * 2 + 260}" height="${BAND_H}" fill="url(#night)" style="mix-blend-mode:multiply"/>`;
  s += `<g style="mix-blend-mode:screen">${glow}</g>`;
  s += clouds + fx;
  s += `</g></g></g>`;
  // 紙の縁
  s += `<rect x="0" y="${BAND_Y - 3}" width="${W}" height="3" fill="#7a5c34"/><rect x="0" y="${BAND_Y + BAND_H}" width="${W}" height="3" fill="#7a5c34"/>`;
  s += `<rect x="0" y="${BAND_Y + BAND_H + 3}" width="${W}" height="14" fill="#000" opacity=".35"/>`;
  // 巻軸
  if (unroll < 1) s += `<rect x="${f1(revealX - 22)}" y="${BAND_Y - 26}" width="44" height="${BAND_H + 52}" rx="10" fill="url(#roller)"/><rect x="${f1(revealX - 26)}" y="${BAND_Y - 40}" width="52" height="18" rx="6" fill="${GOLD}"/><rect x="${f1(revealX - 26)}" y="${BAND_Y + BAND_H + 22}" width="52" height="18" rx="6" fill="${GOLD}"/>`;
  // 字幕
  for (const [a, b2, l1, l2, big] of captions) {
    const op = fadeIn(t, a, b2, 0.22); if (op <= 0) continue;
    const dy = (1 - easeOut(clamp((t - a) / 0.3))) * 18;
    const fs = big ? 72 : 60;
    s += `<g opacity="${op.toFixed(2)}" transform="translate(0,${f1(dy)})">`;
    s += `<text x="520" y="1398" font-size="${fs}" class="m" text-anchor="middle" fill="${IVORY}">${richLine(l1, GOLD)}</text>`;
    s += `<text x="520" y="${1398 + fs * 1.35}" font-size="${fs}" class="m" text-anchor="middle" fill="${IVORY}">${richLine(l2, GOLD)}</text>`;
    s += `</g>`;
  }
  document.getElementById('stage').innerHTML = s;
}

window.setup = async () => {
  makePaper();
  const all = chapters.flat().join('') + captions.flat().join('') + 'わっしょい！ぺったん！ドンドン！留守です二八ずるずるゴーン大福帳一二三四五六七八九十百つ目〇';
  document.getElementById('preload').innerHTML = `<span class="m">${all}</span><span class="k">${all}</span>`;
  await document.fonts.ready;
  render(0);
  await document.fonts.ready;
  return true;
};
window.render = render;
if (!navigator.webdriver) { setup().then(() => { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }); }
</script>
</body>
</html>
